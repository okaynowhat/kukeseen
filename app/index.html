<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kukeseen</title>
<meta name="description" content="Kukeseenekohad Tartu ümbruses: kaart, GPS kompass, oma leiud ja õppematerjal.">
<meta name="theme-color" content="#141F18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kukeseen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Kaart"></div>

  <div class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><b data-t="appName">Kukeseen</b></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnLayers" aria-label="Kaardikiht"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 16 10 5 10-5"/></svg></button>
    <button class="iconbtn" id="btnAbout" aria-label="Rakendusest"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </div>
  <div class="menu" id="layerMenu" style="top:64px;right:10px"></div>
  <div class="menu" id="navMenu"></div>

  <div class="mapbtns">
    <button class="iconbtn" id="btnFollow" aria-label="Jälgi mind" title="Jälgi mind"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
    <button class="iconbtn" id="btnLocate" aria-label="Minu asukoht" title="Minu asukoht"><svg viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8-8-2z"/></svg></button>
  </div>

  <section class="sheet" id="sheet" aria-label="Kohad">
    <div class="handle" id="handle"></div>
    <div class="sheet-head" id="sheetHead"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="pane" id="paneFinds"></section>
  <section class="pane" id="paneLearn"></section>
  <section class="pane" id="paneSeason"></section>
  <section class="pane" id="paneAbout"></section>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="map"><svg viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="nav.map">Kaart</span></button>
    <button class="tab" data-tab="spots"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-t="nav.spots">Kohad</span></button>
    <button class="tab" data-tab="finds"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 0 1 16 0H4z"/><path d="M10 10v8a2 2 0 0 0 4 0v-8"/></svg><span data-t="nav.finds">Minu leiud</span></button>
    <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h7v18H6a2 2 0 0 0-2 2V5z"/><path d="M13 3h5a2 2 0 0 1 2 2v16a2 2 0 0 0-2-2h-5"/></svg><span data-t="nav.learn">Õpi</span></button>
    <button class="tab" data-tab="season"><svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 0 1 .5-8 6 6 0 0 1 11.3 2A3.5 3.5 0 0 1 18 16H7z"/><path d="M9 19v2M13 19v2M17 19v2"/></svg><span data-t="nav.season">Hooaeg</span></button>
  </nav>

  <section class="compass" id="compass" aria-label="Kompass">
    <div class="top"><button class="iconbtn" id="cmpClose" aria-label="Sulge"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h2 id="cmpTitle"></h2></div>
    <div class="dial">
      <svg class="ring" viewBox="0 0 100 100"><g id="ringTicks" stroke="rgba(239,233,214,.35)" stroke-width="1"></g></svg>
      <div class="n">N</div>
      <svg class="arrow" id="cmpArrow" viewBox="0 0 100 100"><path d="M50 4 76 78 50 64 24 78z"/></svg>
    </div>
    <div class="readout">
      <div class="big"><span id="cmpDist">–</span></div>
      <div class="sub" id="cmpSub"></div>
      <div class="ok" id="cmpOk"></div>
    </div>
    <div class="foot">
      <button class="btn" id="cmpPerm" style="display:none"></button>
      <button class="btn" id="cmpMap"></button>
      <button class="btn primary" id="cmpLog"></button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
